# mcp suite — the local devdigest-mcp server (@devdigest/mcp).
# A stdio MCP server that is an HTTP client of the DevDigest API.
# Tests are hermetic (the API is mocked). Uses npm (package-lock.json).
#
# server/src/vendor/shared/** is in the path filter because mcp aliases
# @devdigest/shared to it, at type-check and at run time. .mcp.json is in the
# filter because the stdio test spawns the server exactly as that entry says.
name: mcp

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'server/src/vendor/shared/**'
      - '.mcp.json'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - 'server/src/vendor/shared/**'
      - '.mcp.json'
      - '.github/workflows/mcp.yml'

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
